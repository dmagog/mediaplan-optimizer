name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Установка
        run: pip install -e ".[dev]"
      - name: Стиль
        run: ruff check .
      - name: Граница пакетов
        run: lint-imports
      - name: Тесты
        run: python -m pytest -q
