# Реестр географии кампании: федеральные округа России.
#
# ПРАВИЛО ПРОЕКТА: ни одного числа из головы. Численность населения — из
# публичной сводки данных Росстата на 1 января 2025 года; она используется как
# прокси доли онлайн-аудитории округа. Проникновение интернета по округам
# различается заметно слабее, чем численность населения, поэтому для деления
# бюджета и пересчёта ёмкости каналов этого приближения достаточно; уточнение
# по возрастной структуре и проникновению — отдельный запрос к владельцу мира.
#
# Крым и Севастополь в карту не включены: в исходных данных Natural Earth они
# идут с украинскими кодами, и мы не берём на себя решение спорного вопроса.
# В численности ЮФО они учтены — это данные источника, мы их не правим.

meta:
  version: "1.0"
  population_as_of: "2025-01-01"
  population_as_of_title: "1 января 2025 года"
  source_url: "https://ru.wikipedia.org/wiki/Федеральные_округа_Российской_Федерации"
  source_note: "сводная таблица численности населения по округам (данные Росстата)"
  map_source: "Natural Earth 50m admin-1 (public domain), https://www.naturalearthdata.com/"
  cities_source_url: "https://ru.wikipedia.org/wiki/Города-миллионеры_России"
  cities_note: |
    Города федерального значения и города-миллионеры по округам на 1 января
    2025 года. Нужны кабинету не для расчёта, а чтобы поймать несочетаемое
    условие: «столица» без Центрального и Северо-Западного округов пустая.

